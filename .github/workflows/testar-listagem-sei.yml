name: Testar descoberta de notas no SEI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listar-documentos:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Localizar documentos fiscais publicos
        env:
          SEI_PROCESSO_URL: 'https://sei.utfpr.edu.br/sei/modulos/pesquisa/md_pesq_processo_exibir.php?iI3OtHvPArITY997V09rhsSkbDKbaYSycOHqqF2xsM0IaDkkEyJpus7kCPb435VNEAb16AAxmJKUdrsNWVIqQ81On4VzSUQQ8RvYnANh-v1u95GlOXhULO7esemKdXq0'
        run: |
          python - <<'PY'
          import re
          import sys
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; SEI-Public-Process-Check/1.0)",
              "Accept": "text/html,application/xhtml+xml,application/pdf;q=0.9,*/*;q=0.5"
          })
          url = __import__('os').environ['SEI_PROCESSO_URL']
          try:
              response = session.get(url, timeout=30, allow_redirects=True)
              response.raise_for_status()
          except requests.RequestException as error:
              print(f"FALHA NA PAGINA DO PROCESSO: {error}")
              sys.exit(1)

          print(f"Status HTTP: {response.status_code}")
          print(f"Tipo de conteudo: {response.headers.get('Content-Type', 'nao informado')}")
          print(f"Bytes recebidos da listagem: {len(response.content)}")
          if 'html' not in response.headers.get('Content-Type', '').lower():
              sys.exit('A resposta do processo nao parece ser HTML; precisamos examinar o formato.')

          soup = BeautifulSoup(response.content, 'html.parser')
          candidatos = []
          for linha in soup.find_all('tr'):
              titulo = linha.get_text(' ', strip=True)
              if not re.search(r'nota\s+fiscal|\bnf-?e\b|\bnfs-?e\b', titulo, re.I):
                  continue
              # Identificadores como 5492599 que aparecem na lista publica.
              ids = re.findall(r'(?<!\d)\d{6,8}(?!\d)', titulo)
              links = []
              for ancora in linha.find_all('a'):
                  href = (ancora.get('href') or '').strip()
                  if 'md_pesq_documento_consulta_externa.php' in href:
                      completo = urljoin(response.url, href)
                      if urlparse(completo).hostname == 'sei.utfpr.edu.br':
                          links.append(completo)
              candidatos.append((titulo[:160], ids, list(dict.fromkeys(links))))

          print(f"Linhas de notas fiscais encontradas: {len(candidatos)}")
          for numero, (titulo, ids, links) in enumerate(candidatos[:20], start=1):
              print(f"{numero:02d} | {titulo} | IDs={ids} | links PDF={len(links)}")

          if not candidatos:
              print('Nenhuma linha de Nota Fiscal foi localizada no HTML retornado. Pode haver paginacao, JavaScript ou sessao.')
              sys.exit(2)
          enderecos = list(dict.fromkeys(link for _, _, links in candidatos for link in links))
          print(f"Links diretos recuperados: {len(enderecos)}")
          if not enderecos:
              print('A lista mostra notas, mas seus links nao foram extraidos; precisaremos examinar a estrutura HTML.')
              sys.exit(3)

          print('Testando o acesso de ate 3 links publicos de notas fiscais...')
          pdf_validos = 0
          for numero, destino in enumerate(enderecos[:3], start=1):
              try:
                  resposta = session.get(destino, timeout=30)
                  valido = resposta.status_code == 200 and resposta.content.startswith(b'%PDF-')
                  print(f"Link {numero}: HTTP {resposta.status_code}; tipo {resposta.headers.get('Content-Type', '-')}; bytes {len(resposta.content)}; PDF valido={valido}")
                  if valido:
                      pdf_validos += 1
              except requests.RequestException as error:
                  print(f"Link {numero}: falhou ({type(error).__name__})")
          print(f"RESULTADO: {pdf_validos} arquivo(s) PDF validado(s) de {min(3, len(enderecos))} link(s) testado(s).")
          if not pdf_validos:
              sys.exit('Links encontrados, mas nenhum PDF valido foi recebido.')
          PY
