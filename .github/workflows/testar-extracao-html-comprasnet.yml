name: Testar extracao HTML Comprasnet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Consultar paginas e extrair tabelas
        run: python scripts/testar_html_contratos.py
      - name: Salvar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracao-html-comprasnet
          path: diagnostico_comprasnet/
          if-no-files-found: warn
